<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#ff0055" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Glowing subtle shadow behind A -->
  <text x="32" y="47" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="900" fill="#ff0055" text-anchor="middle" filter="url(#glow)" opacity="0.6">A</text>
  
  <!-- Signature Serif A in vibrant rose-red -->
  <text x="32" y="47" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="900" fill="#ff0055" text-anchor="middle">A</text>
</svg>
